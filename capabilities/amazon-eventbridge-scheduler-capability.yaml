info:
  label: Amazon EventBridge Scheduler
  description: Amazon EventBridge Scheduler is a serverless scheduler that allows you to create, run, and manage tasks from
    one central, managed service. EventBridge Scheduler delivers your tasks reliably, with built-in mechanisms that adjust
    your schedules based on the availability of downstream targets. The following reference lists the available API actions,
    and data types for EventBridge Scheduler.
  tags:
  - Amazon
  - Eventbridge
  - Scheduler
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
